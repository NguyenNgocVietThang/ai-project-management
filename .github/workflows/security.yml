# Kiểm tra bảo mật tĩnh, quét lỗ hổng phụ thuộc, và các cổng chất lượng.
#
# Được bổ sung sau đợt rà soát phát hiện hai thư viện ghim phiên bản có lỗ hổng
# tồn tại trong dự án mà không được chú ý (python-jose 3.3.0, next 15.0.0 — bản thân npm
# đã đánh dấu bản sau là deprecated vì cảnh báo bảo mật). Khi không có công cụ giám sát tự động,
# các vấn đề này sẽ không được phát hiện cho đến khi kiểm tra thủ công.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Hàng tuần: một thư viện an toàn hôm nay có thể phát sinh cảnh báo bảo mật vào ngày mai
    # ngay cả khi không có ai chạm vào kho lưu trữ này.
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  python:
    name: Python dependencies & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit ruff

      - name: Audit dependencies for known CVEs
        run: pip-audit --requirement requirements.txt --strict

      # Trước đây bước này là continue-on-error vì có 909 vi phạm tồn đọng. Chúng
      # đã được dọn (1000 lỗi sửa tự động, phần còn lại là forward-reference của
      # SQLAlchemy nay được ignore theo phạm vi file), nên nó là cổng chặn thật.
      - name: Lint
        run: ruff check app tests

  node:
    name: Node dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Chỉ áp dụng cho mức High/Critical: mức Moderate hầu hết là cảnh báo của dev-server và thời điểm build,
      # không ảnh hưởng tới người dùng cuối trong môi trường triển khai.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  tests:
    name: Backend test suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    # Trước đây CI hoàn toàn không chạm tới frontend: không typecheck, không lint,
    # không build, không test. Một thay đổi làm vỡ biên dịch vẫn merge được sạch sẽ.
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_WS_URL: ws://localhost:8000
