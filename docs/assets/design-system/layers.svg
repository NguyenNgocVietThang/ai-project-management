<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">Các lớp của design system</title><desc id="desc">Luồng giá trị từ globals.css tới Tailwind, component và màn hình nghiệp vụ.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.pulse{animation:pulse 4s ease-in-out infinite}.travel{animation:travel 5s ease-in-out infinite}.step{animation:step 6s ease-in-out infinite}.b{animation-delay:2s}.c{animation-delay:4s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}@keyframes step{0%,30%,100%{opacity:1}35%,95%{opacity:.5}}@media(prefers-reduced-motion:reduce){.pulse,.travel,.step{animation:none!important}}</style><rect x="0" y="0" width="1200" height="310" rx="20" fill="#f8fafc" stroke="none"/><text x="40" y="52" font-size="25" fill="#0f1729" font-weight="600">TỪ TOKEN ĐẾN MÀN HÌNH</text><rect x="40" y="90" width="244" height="145" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="58" y="124" font-size="14" fill="#0f756d" font-weight="600">01 / CSS</text><text x="58" y="166" font-size="18" fill="#0f1729" font-weight="600">HSL + theme</text><text x="58" y="202" font-size="14" fill="#48566a" font-weight="400">globals.css</text><path d="M292 162h26m-6-5 6 5-6 5" fill="none" stroke="#0f756d" stroke-width="2"/><circle class="travel" cx="292" cy="162" r="3" fill="#0f756d"/><rect x="332" y="90" width="244" height="145" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="350" y="124" font-size="14" fill="#0f756d" font-weight="600">02 / TAILWIND</text><text x="350" y="166" font-size="18" fill="#0f1729" font-weight="600">Utility + scale</text><text x="350" y="202" font-size="14" fill="#48566a" font-weight="400">tailwind.config.ts</text><path d="M584 162h26m-6-5 6 5-6 5" fill="none" stroke="#0f756d" stroke-width="2"/><circle class="travel" cx="584" cy="162" r="3" fill="#0f756d"/><rect x="624" y="90" width="244" height="145" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="642" y="124" font-size="14" fill="#0f756d" font-weight="600">03 / COMPONENT</text><text x="642" y="166" font-size="18" fill="#0f1729" font-weight="600">Trạng thái + hành vi</text><text x="642" y="202" font-size="14" fill="#48566a" font-weight="400">common / ui</text><path d="M876 162h26m-6-5 6 5-6 5" fill="none" stroke="#0f756d" stroke-width="2"/><circle class="travel" cx="876" cy="162" r="3" fill="#0f756d"/><rect x="916" y="90" width="244" height="145" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="934" y="124" font-size="14" fill="#0f756d" font-weight="600">04 / SCREEN</text><text x="934" y="166" font-size="18" fill="#0f1729" font-weight="600">Dữ liệu + quyền</text><text x="934" y="202" font-size="14" fill="#48566a" font-weight="400">features / app</text><text x="40" y="280" font-size="16" fill="#48566a" font-weight="400">Nguồn chuẩn: CSS → Tailwind → Component → Màn hình. SVG chỉ minh họa.</text></svg>