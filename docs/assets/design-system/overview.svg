<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc"><title id="title">Design system sáng và tối</title><desc id="desc">Hai bảng giao diện dùng chung token ngữ nghĩa; chấm trạng thái thay đổi độ mờ nhẹ, có hỗ trợ giảm chuyển động.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.pulse{animation:pulse 4s ease-in-out infinite}.travel{animation:travel 5s ease-in-out infinite}.step{animation:step 6s ease-in-out infinite}.b{animation-delay:2s}.c{animation-delay:4s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}@keyframes step{0%,30%,100%{opacity:1}35%,95%{opacity:.5}}@media(prefers-reduced-motion:reduce){.pulse,.travel,.step{animation:none!important}}</style><rect x="0" y="0" width="1200" height="530" rx="20" fill="#f8fafc" stroke="none"/><text x="40" y="49" font-size="14" fill="#0f756d" font-weight="600">DESIGN SYSTEM / AI PROJECT PLANNING</text><text x="40" y="98" font-size="34" fill="#0f1729" font-weight="600">Rõ dữ liệu. Nhất quán thao tác.</text><text x="40" y="133" font-size="18" fill="#48566a" font-weight="400">Teal + Slate · Inter · Light / Dark · Chuyển động nhẹ</text><rect x="40" y="166" width="550" height="238" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="64" y="198" font-size="13" fill="#48566a" font-weight="600">LIGHT</text><text x="64" y="235" font-size="24" fill="#0f1729" font-weight="600">Kế hoạch dự án</text><text x="64" y="265" font-size="15" fill="#48566a" font-weight="400">Thông tin rõ ràng, hành động có thứ bậc</text><rect x="64" y="285" width="86" height="12" rx="6" fill="#0f756d" stroke="none"/><rect x="164" y="285" width="86" height="12" rx="6" fill="#047756" stroke="none"/><rect x="264" y="285" width="86" height="12" rx="6" fill="#b35309" stroke="none"/><rect x="364" y="285" width="86" height="12" rx="6" fill="#0369a0" stroke="none"/><rect x="464" y="285" width="86" height="12" rx="6" fill="#c52020" stroke="none"/><rect x="64" y="322" width="184" height="48" rx="12" fill="#0f756d" stroke="none"/><text x="83" y="352" font-size="16" fill="#ffffff" font-weight="600">Xem kế hoạch</text><rect x="264" y="322" width="142" height="48" rx="12" fill="#f1f5f9" stroke="none"/><text x="284" y="352" font-size="16" fill="#0f1729" font-weight="400">Tùy chọn</text><circle class="pulse" cx="540" cy="346" r="8" fill="#047756"/><rect x="610" y="166" width="550" height="238" rx="12" fill="#0e1320" stroke="#202b3c"/><text x="634" y="198" font-size="13" fill="#9dabbe" font-weight="600">DARK</text><text x="634" y="235" font-size="24" fill="#f1f5f9" font-weight="600">Kế hoạch dự án</text><text x="634" y="265" font-size="15" fill="#9dabbe" font-weight="400">Thông tin rõ ràng, hành động có thứ bậc</text><rect x="634" y="285" width="86" height="12" rx="6" fill="#2bd4bd" stroke="none"/><rect x="734" y="285" width="86" height="12" rx="6" fill="#36d399" stroke="none"/><rect x="834" y="285" width="86" height="12" rx="6" fill="#fbbd23" stroke="none"/><rect x="934" y="285" width="86" height="12" rx="6" fill="#3abff8" stroke="none"/><rect x="1034" y="285" width="86" height="12" rx="6" fill="#f87272" stroke="none"/><rect x="634" y="322" width="184" height="48" rx="12" fill="#2bd4bd" stroke="none"/><text x="653" y="352" font-size="16" fill="#0b111e" font-weight="600">Xem kế hoạch</text><rect x="834" y="322" width="142" height="48" rx="12" fill="#1a2333" stroke="none"/><text x="854" y="352" font-size="16" fill="#f1f5f9" font-weight="400">Tùy chọn</text><circle class="pulse" cx="1110" cy="346" r="8" fill="#36d399"/><text x="40" y="453" font-size="30" fill="#0f1729" font-weight="600">36 / Display</text><text x="342" y="451" font-size="24" fill="#0f1729" font-weight="600">24 / Heading</text><text x="635" y="451" font-size="16" fill="#0f1729" font-weight="400">16 / Body</text><text x="867" y="451" font-size="14" fill="#48566a" font-weight="400">14 / Body small</text><text x="40" y="500" font-size="14" fill="#48566a" font-weight="400">Minh họa quy tắc từ mã nguồn · Không phải ảnh chụp ứng dụng</text></svg>