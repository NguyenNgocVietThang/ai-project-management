<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="344" viewBox="0 0 1200 344" role="img" aria-labelledby="title desc"><title id="title">Ba trạng thái của thao tác lưu</title><desc id="desc">Ba ví dụ cùng hiển thị để đọc ngay cả khi trình xem tắt hiệu ứng.</desc><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.pulse{animation:pulse 4s ease-in-out infinite}.travel{animation:travel 5s ease-in-out infinite}.step{animation:step 6s ease-in-out infinite}.b{animation-delay:2s}.c{animation-delay:4s}@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}@keyframes travel{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}@keyframes step{0%,30%,100%{opacity:1}35%,95%{opacity:.5}}@media(prefers-reduced-motion:reduce){.pulse,.travel,.step{animation:none!important}}</style><rect x="0" y="0" width="1200" height="344" rx="20" fill="#f8fafc" stroke="none"/><text x="40" y="52" font-size="25" fill="#0f1729" font-weight="600">TRẠNG THÁI TƯƠNG TÁC</text><rect x="40" y="86" width="340" height="185" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="62" y="122" font-size="18" fill="#0f1729" font-weight="600">01 / Sẵn sàng</text><g class="step "><rect x="62" y="146" width="296" height="48" rx="12" fill="#0f756d" stroke="none"/><text x="85" y="177" font-size="16" fill="#ffffff" font-weight="600">Lưu thay đổi</text></g><text x="62" y="239" font-size="14" fill="#48566a" font-weight="400">Nhãn hành động cụ thể</text><rect x="430" y="86" width="340" height="185" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="452" y="122" font-size="18" fill="#0f1729" font-weight="600">02 / Đang xử lý</text><g class="step b"><rect x="452" y="146" width="296" height="48" rx="12" fill="#f1f5f9" stroke="none"/><text x="475" y="177" font-size="16" fill="#48566a" font-weight="600">Đang lưu…</text></g><text x="452" y="239" font-size="14" fill="#48566a" font-weight="400">Spinner + disabled + aria-busy</text><rect x="820" y="86" width="340" height="185" rx="12" fill="#ffffff" stroke="#e1e7ef"/><text x="842" y="122" font-size="18" fill="#0f1729" font-weight="600">03 / Hoàn tất</text><g class="step c"><rect x="842" y="146" width="296" height="48" rx="12" fill="#047756" stroke="none"/><text x="865" y="177" font-size="16" fill="#ffffff" font-weight="600">Đã cập nhật</text></g><text x="842" y="239" font-size="14" fill="#48566a" font-weight="400">Nhãn chữ + màu trạng thái</text><text x="40" y="311" font-size="16" fill="#48566a" font-weight="400">Chuyển động chỉ mô phỏng phản hồi. Bật reduced motion để xem trạng thái tĩnh.</text></svg>