<title>Kiến trúc hệ thống</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#04010d"/><stop offset="1" stop-color="#14033a"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="48" height="28" patternUnits="userSpaceOnUse">
    <path d="M0 0L48 28M48 0L0 28" stroke="#2a0f5e" stroke-width="1" fill="none" opacity="0.7"/>
  </pattern>
</defs>
<style>
