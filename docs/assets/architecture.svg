  .float{animation:bob 4.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .dash{stroke-dasharray:7 9;animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-16}}
  .pulse{animation:pl 2.6s ease-in-out infinite}
  @keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}
</style>
