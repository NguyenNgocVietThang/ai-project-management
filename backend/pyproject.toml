[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Quan he SQLAlchemy dung forward reference dang chuoi (Mapped["User"]) duoc phan
# giai luc cau hinh mapper, khong phai luc import. Ruff khong theo duoc chuoi do
# nen bao undefined-name cho moi quan he trong tang model. Chung khong phai loi -
# app import duoc va bo test chung minh mapper cau hinh dung.
"app/models/*.py" = ["F821"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
